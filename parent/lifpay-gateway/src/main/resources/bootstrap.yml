server:
  port: 9001
spring:
  application:
    name: lifpay-gateway
  cloud:
    nacos:
      config:
        enabled: true # 开启Nacos配置中心
        server-addr: 43.134.188.63:8848
        file-extension: yaml
        namespace: 52499532-e840-4773-8b08-da5f1ddaf764
        group: DEFAULT_GROUP
        username: nacos
        password: lifpay@2026
      discovery:
        enabled: true # 开启Nacos服务发现
        server-addr: 43.134.188.63:8848 # 与config一致
        namespace: 52499532-e840-4773-8b08-da5f1ddaf764 # 与config一致，避免命名空间混乱
        username: nacos # 服务发现也需鉴权账号密码（云部署Nacos必配）
        password: lifpay@2026 # 与config一致
        ephemeral: true
  # 核心修正：1.扩展名统一为yaml 2.简化写法（自动匹配，避免手动写错）
  config:
    import: nacos:lifpay-gateway.yaml?namespace=52499532-e840-4773-8b08-da5f1ddaf764