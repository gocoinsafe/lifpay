server:
  port: 9010
spring:
  application:
    name: lifpay-admin
  cloud:
    nacos:
      config:
        enabled: true # 开启配置中心（必须改true，否则配置不生效）
        server-addr: 43.134.188.63:8848
        file-extension: yaml # 修正为官方推荐的yaml（兼容yml，但更规范）
        namespace: c74135b2-3e6b-463d-ab85-da1fff8754cb
      discovery:
        enabled: true
        server-addr: 43.134.188.63:8848
        namespace: c74135b2-3e6b-463d-ab85-da1fff8754cb # 建议和config的namespace一致
  # 核心：修正import格式，添加nacos:前缀，指定从Nacos导入
  config:
    import: nacos:lifpay-admin.yml?namespace=c74135b2-3e6b-463d-ab85-da1fff8754cb # 完整格式：nacos:${Data ID}
    # 简化写法（自动匹配application.name + file-extension）：import: nacos: